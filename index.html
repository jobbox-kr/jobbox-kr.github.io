<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>업무 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--bg:#F3F8EC;--bg2:#E3F1D3;--card:#fff;--ink:#24321D;--muted:#6D7B64;--accent:#6DBB5A;--butter:#FFF2BF;--sky:#D3EDF9;--pink:#FDE0E6;--lav:#E9E3FB;--shadow:0 4px 18px rgba(70,110,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#131911;--bg2:#1B2617;--card:#1E271A;--ink:#EAF2E2;--muted:#A3B29A;--accent:#8FD47B;--butter:#3B3317;--sky:#1D3846;--pink:#43232B;--lav:#2E2846;--shadow:0 4px 18px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg) linear-gradient(180deg,var(--bg2),var(--bg) 320px) no-repeat;color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;font-size:30px;margin:0;display:flex;align-items:center;gap:10px}
.badge{font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--lav);color:var(--ink)}
.sub{margin:0 0 6px;color:var(--muted);font-size:14px}
.tool{display:flex;align-items:center;gap:14px;padding:18px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);text-decoration:none;color:var(--ink)}
.tool:hover{outline:2px solid var(--accent)}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:0 0 auto}
.tool.g .ico{background:var(--butter)} .tool.b .ico{background:var(--sky)} .tool.p .ico{background:var(--pink)} .tool.l .ico{background:var(--lav)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.txt b{font-size:17px} .txt small{color:var(--muted);font-size:13px}
.go{font-size:26px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<main class="wrap">
  <h1>업무 도구</h1>
  <p class="sub">선생님이 쓰는 도구 모음이에요</p>
    <a class="tool g" href="./sticker/">
      <span class="ico">⭐</span>
      <span class="txt"><b>칭찬스티커판</b><small>아이들에게 칭찬 스티커를 붙여주고 학부모에게 보내요</small></span>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <a class="tool b" href="./sticker/guide/">
      <span class="ico">📖</span>
      <span class="txt"><b>칭찬스티커판 사용법</b><small>처음 쓰는 선생님을 위한 화면별 설명서</small></span>
      <span class="go" aria-hidden="true">›</span>
    </a>
  <p class="foot">즐겨찾기나 홈 화면에 추가해 두면 편해요</p>
</main>
</body>
</html>
