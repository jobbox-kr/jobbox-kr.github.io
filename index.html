<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>업무 도구</title>
<style>
:root{--bg:#F3F8EC;--card:#fff;--ink:#24321D;--muted:#6D7B64;--accent:#6DBB5A}
@media (prefers-color-scheme:dark){:root{--bg:#131911;--card:#1E271A;--ink:#EAF2E2;--muted:#A3B29A;--accent:#8FD47B}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.box{background:var(--card);border-radius:24px;padding:28px;max-width:360px;width:100%;box-shadow:0 4px 18px rgba(70,110,40,.08)}
h1{font-size:20px;margin:0 0 6px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
a{display:block;text-decoration:none;background:var(--accent);color:#fff;font-weight:700;text-align:center;padding:14px;border-radius:14px}
</style>
</head>
<body>
<div class="box">
<h1>업무 도구</h1>
<p>안내받은 도구로 이동하세요.</p>
<a href="./sticker/">칭찬스티커판</a>
</div>
</body>
</html>
